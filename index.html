<title>Nour Carrière — Trouve un emploi qui te correspond</title>
<style>
:root{
  font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  color:#1b3435;
  background:#f6f9f8;
  --green:#125a59;
  --dark:#103a3c;
  --soft:#e7f4ef;
  --line:#dce9e4;
  --muted:#647c79;
}
*{box-sizing:border-box}
body{margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,
select:focus-visible,textarea:focus-visible{
  outline:3px solid #33aea1;
  outline-offset:3px;
}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.sidebar{
  background:#fff;border-right:1px solid var(--line);
  padding:25px 15px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 25px}
.mark{
  background:var(--dark);color:#fff;width:44px;height:44px;
  border-radius:14px;display:grid;place-items:center;
  font-size:25px;font-weight:800;
}
.brand strong{display:block;font-size:17px}
.brand small{color:var(--muted);font-size:12px}
.menu{display:grid;gap:5px}
.menu button{
  text-align:left;border:0;background:transparent;color:#536b69;
  border-radius:11px;padding:13px 14px;font-weight:650;
}
.menu button.active,.menu button:hover{
  background:#e5f3ef;color:var(--dark);
}
.sidebar-note{
  margin-top:auto;background:var(--soft);padding:14px;
  border-radius:14px;color:#48645f;font-size:12px;line-height:1.7;
}
.content{
  padding:31px clamp(18px,4vw,58px) 55px;
  min-width:0;max-width:1660px;width:100%;margin:auto;
}
.top{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:24px;
}
.eyebrow{
  font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:#36867d;font-size:11px;
}
.hint{color:var(--muted);font-size:13px}
.mobilebar{display:none}
.title{
  font-size:clamp(28px,3.6vw,44px);line-height:1.13;
  letter-spacing:-1.4px;color:#173b3d;margin:8px 0 12px;
}
.lead{
  color:#667d7a;line-height:1.75;max-width:760px;
  margin:0 0 26px;
}
.hero{
  background:linear-gradient(125deg,#124649,#177969);
  color:white;border-radius:25px;
  padding:clamp(25px,4vw,45px);
  display:grid;gap:15px;
  box-shadow:0 18px 44px #14565422;
}
.hero h1{
  font-size:clamp(29px,4vw,48px);
  letter-spacing:-1.3px;line-height:1.14;
  max-width:690px;margin:0;
}
.hero p{color:#e0efea;line-height:1.7;max-width:690px;margin:0}
.hero .btn{border-color:#fff;color:#154b45;background:#fff}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{
  padding:10px 15px;min-height:42px;
  display:inline-flex;align-items:center;justify-content:center;
  gap:7px;border:1px solid #bed5ce;border-radius:11px;
  background:#fff;color:#155d57;font-weight:750;
  font-size:13px;line-height:1.2;
  transition:transform .15s,border .15s;
}
.btn:hover{transform:translateY(-1px);border-color:#458e84}
.primary{background:var(--green);border-color:var(--green);color:white}
.ghost{background:#eff7f3;border-color:#e5efeb}
.danger{color:#aa4343}
.small{padding:7px 10px;min-height:34px}
.panel,.card,.stat{
  background:white;border:1px solid #e0eae6;
  border-radius:17px;box-shadow:0 9px 32px #153f4310;
}
.panel{padding:22px;margin:16px 0}
.grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
  padding:20px;display:flex;flex-direction:column;
  gap:12px;min-width:0;
}
.card h3{
  font-size:17px;color:#173b3d;margin:0;
  overflow-wrap:anywhere;
}
.card p{color:#657875;line-height:1.62;margin:0;font-size:13px}
.card .actions{margin-top:auto;padding-top:4px}
.stat{padding:18px}
.stat b{display:block;font-size:29px;color:#184e4c}
.stat span{color:var(--muted);font-size:13px}
.section{
  font-size:23px;color:#153d3e;letter-spacing:-.5px;
  margin:30px 0 16px;
}
.tag{
  font-size:11px;font-weight:800;display:inline-flex;
  padding:6px 9px;background:#e6f4ee;border-radius:30px;
  color:#24695e;width:max-content;max-width:100%;
}
.tag.amber{background:#fff3de;color:#92612b}
.tag.gray{background:#f1f3f2;color:#667a75}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
.field{
  border:1px solid #dce6e2;border-radius:11px;
  background:white;padding:11px 12px;
  min-height:43px;min-width:0;color:#1b4041;
}
.field.search{flex:1;min-width:220px}
.field:focus{outline:2px solid #4caaa1}
.toggle{
  background:white;border:1px solid var(--line);
  border-radius:11px;padding:10px 13px;
  display:flex;align-items:center;gap:7px;
  font-size:13px;font-weight:650;
}
.initial{
  width:46px;height:46px;background:#e8f5f1;color:var(--green);
  display:grid;place-items:center;border-radius:14px;
  font-size:19px;font-weight:900;
}
.company-name{display:flex;align-items:center;gap:12px}
.company-name h3{margin-bottom:3px}
.company-name span{font-size:12px;color:#788985}
.notice{
  background:#edf7f4;border-left:4px solid #367d75;
  border-radius:11px;padding:16px 18px;font-size:13px;
  line-height:1.7;color:#42635e;margin:19px 0;
}
.notice.warn{
  background:#fff8ee;border-color:#b58b45;color:#725d38;
}
.intro-cards{margin-top:20px}
.listline{
  border-bottom:1px solid #e6eeea;padding:13px 0;
  color:#4e6662;font-size:14px;line-height:1.65;
}
.listline:last-child{border:0}
.formgrid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.formgroup{display:grid;gap:7px}
.formgroup label{font-size:13px;font-weight:700;color:#486663}
.formgroup .field{width:100%}
.full{grid-column:1/-1}
textarea.field{min-height:120px;resize:vertical;line-height:1.6}
.draft{
  white-space:pre-wrap;padding:20px;background:#f6faf8;
  border:1px solid var(--line);border-radius:12px;
  line-height:1.8;color:#3c5652;font-size:14px;
  overflow-wrap:anywhere;
}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:750px}
th,td{
  text-align:left;padding:12px 10px;
  border-bottom:1px solid #e5eeeb;
  vertical-align:top;font-size:13px;
}
th{font-size:12px;color:#778984;background:#f8fbfa}
td .field{max-width:160px}
table a{color:#0a6b69;text-decoration:underline}
.empty{
  text-align:center;padding:42px 20px;background:white;
  border:1px dashed #d2e0dc;border-radius:17px;color:#687e77;
}
.footer{
  border-top:1px solid var(--line);margin-top:45px;
  padding-top:18px;color:#7b908b;font-size:12px;line-height:1.8;
}
.count{color:#6c8580;font-weight:650;font-size:13px}
.toast{
  position:fixed;bottom:22px;right:22px;z-index:20;
  padding:14px 20px;border-radius:11px;
  background:#123f40;color:#fff;
  box-shadow:0 10px 35px #173f4055;max-width:320px;
}
@media(max-width:1100px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shell{grid-template-columns:215px minmax(0,1fr)}
}
@media(max-width:740px){
  .shell{display:block}
  .sidebar{display:none}
  .mobilebar{
    position:sticky;top:0;z-index:5;display:block;
    background:#fff;border-bottom:1px solid var(--line);
    padding:10px 12px;
  }
  .mobilebrand{
    font-weight:900;color:#114947;padding:5px 6px 10px;
  }
  .mobilemenu{
    display:flex;overflow-x:auto;gap:6px;
    padding-bottom:4px;scrollbar-width:thin;
  }
  .mobilemenu button{
    white-space:nowrap;border:0;border-radius:9px;
    padding:10px 12px;background:#f0f5f3;
    color:#486d66;font-weight:700;font-size:12px;
  }
  .mobilemenu button.active{
    background:#145b56;color:white;
  }
  .content{padding:20px 14px 45px}
  .top{margin-bottom:18px}
  .grid,.grid.two,.formgrid{grid-template-columns:1fr}
  .hero{border-radius:17px}
  .panel{padding:17px}
  .filters .field,.filters .toggle{width:100%}
  .filters .field.search{min-width:0}
  .toast{left:16px;right:16px;bottom:16px}
}
</style>
</head>

function useStockage(cle,defaut){
  const [v,setV]=useState(()=>{
    try{
      return JSON.parse(localStorage.getItem('nour-'+cle))??defaut;
    }catch{
      return defaut;
    }
  });
  useEffect(()=>{
    try{
      localStorage.setItem('nour-'+cle,JSON.stringify(v));
    }catch{}
  },[cle,v]);
  return [v,setV];
}

const normaliser=s=>(s||'')
  .normalize('NFD')
  .replace(/[\u0300-\u036f]/g,'')
  .toLowerCase();

const rechercheEntreprise=n=>
  `https://www.google.com/search?q=${
    encodeURIComponent(n+' recrutement carrière site officiel')
  }`;

const rechercheOffre=(m,lieu)=>
  `https://fr.indeed.com/jobs?q=${
    encodeURIComponent(m+' temps partiel')
  }&l=${encodeURIComponent(lieu||'Paris')}`;

function Lien({href,children,classe='btn'}){
  return <a className={classe}
            href={href}
            target="_blank"
            rel="noopener noreferrer">
    {children} ↗
  </a>;
}

function Titre({surtitre,titre,texte}){
  return <>
    <div className="eyebrow">{surtitre}</div>
    <h1 className="title">{titre}</h1>
    <p className="lead">{texte}</p>
  </>;
}

function csvExport(lignes){
  const noms=['Entreprise','Poste','Statut','Date','Notes','Lien'];
  const data=[
    noms,
    ...lignes.map(a=>[
      a.nom,a.poste,a.statut,a.date,a.notes,a.url
    ])
  ];
  const csv='\uFEFF'+data.map(r=>
    r.map(x=>'"'+String(x||'').replaceAll('"','""')+'"')
      .join(';')
  ).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  const u=URL.createObjectURL(blob);
  a.href=u;
  a.download='nour-candidatures.csv';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}

            <td>
             <button className="btn small danger"
              onClick={()=>setSuivi(v=>
               v.filter(x=>x.id!==a.id)
              )}>
              Supprimer
             </button>
            </td>
           </tr>
          )}
         </tbody>
        </table>
       </div>
     }
    </>}

    {/* =====================================================
        MESSAGES RH
       ===================================================== */}
    {onglet==='messages'&&<>
     <Titre
      surtitre="Contact direct"
      titre="Rédige tes messages RH"
      texte="Prépare un message personnalisé pour candidater, poser une question sur le règlement vestimentaire ou relancer une entreprise. Aucun envoi automatique."
     />

     <div className="panel">
      <div className="formgrid">
       <div className="formgroup">
        <label>Type de message</label>
        <select className="field"
         value={modele}
         onChange={e=>setModele(e.target.value)}>
         <option value="candidature">Candidature spontanée</option>
         <option value="conditions">Questions sur les conditions</option>
         <option value="relance">Relance</option>
        </select>
       </div>

       <div className="formgroup">
        <label>Entreprise</label>
        <input className="field"
         value={nomEntreprise}
         onChange={e=>setNomEntreprise(e.target.value)}
         placeholder="Ex. AXA"/>
       </div>

       <div className="formgroup full">
        <label>Poste visé</label>
        <input className="field"
         value={posteMessage}
         onChange={e=>setPosteMessage(e.target.value)}
         placeholder="Ex. Assistante administrative"/>
       </div>
      </div>

      <h2 className="section">Aperçu</h2>
      <div className="draft">{message}</div>

      <div className="row" style={{marginTop:15}}>
       <button className="btn primary" onClick={copier}>
        Copier le message
       </button>
       <a className="btn"
        href={
         'mailto:?subject='+
         encodeURIComponent('Candidature – '+posteMessage)+
         '&body='+encodeURIComponent(message)
        }>
        Ouvrir mon e-mail ↗
       </a>
      </div>
     </div>

     <div className="notice">
      Pour postuler réellement, ouvre le portail de recrutement,
      cherche une annonce compatible puis utilise la candidature
      du site. Un simple e-mail ne remplace pas toujours
      le dépôt du CV.
     </div>
    </>}

    {/* =====================================================
        DROITS ET CONSEILS
       ===================================================== */}
    {onglet==='droits'&&<>
     <Titre
      surtitre="Ressources pratiques"
      titre="Connaître ses droits"
      texte="Quelques repères généraux en France, à distinguer des règles applicables à chaque poste et entreprise."
     />

     <div className="panel">
      <h2>Port du voile et emploi</h2>
      <p className="lead">
       Dans le secteur privé, le port d'un signe religieux
       n'est pas automatiquement interdit. Certaines restrictions
       peuvent être légalement justifiées selon les fonctions,
       la sécurité et des règles de neutralité applicables.
       Les agents publics sont soumis à une obligation de neutralité
       dans l'exercice de leurs fonctions.
      </p>

      <h2>Prières et horaires</h2>
      <p className="lead">
       Les pauses et les éventuels aménagements doivent être
       discutés avec l'employeur dans le respect de l'organisation
       et des règles applicables. Le télétravail ne garantit pas
       automatiquement une liberté totale d'horaires.
      </p>

      <h2>Discrimination</h2>
      <p className="lead">
       Le recrutement ne doit pas reposer sur une discrimination
       illicite fondée sur la religion. En cas de doute, tu peux
       consulter le Défenseur des droits et des sources officielles.
      </p>

      <div className="row">
       <Lien href="https://www.service-public.fr/">
        Service Public
       </Lien>
       <Lien href="https://www.defenseurdesdroits.fr/">
        Défenseur des droits
       </Lien>
       <Lien href="https://www.legifrance.gouv.fr/">
        Légifrance
       </Lien>
      </div>
     </div>

     <div className="panel">
      <h2>Points à vérifier avant de signer</h2>
      {[
       'Salaire brut, heures garanties et type de contrat',
       'Temps de transport et lieu de travail exact',
       'Règlement vestimentaire applicable au poste',
       'Organisation des pauses et télétravail',
       'Missions réelles et éventuels objectifs de rendement'
      ].map(t=>
       <div className="listline" key={t}>✓ {t}</div>
      )}
     </div>

     <div className="panel">
      <h2>Formations et accompagnement</h2>
      <div className="row">
       <Lien href="https://www.francetravail.fr/candidat/en-formation.html">
        Formations France Travail
       </Lien>
       <Lien href="https://www.unml.info/">
        Missions locales
       </Lien>
       <Lien href="https://www.moncompteformation.gouv.fr/">
        Mon Compte Formation
       </Lien>
      </div>
     </div>
    </>}

    {/* =====================================================
        PROFIL
       ===================================================== */}
    {onglet==='profil'&&<>
     <Titre
      surtitre="Préférences"
      titre="Ma recherche d'emploi"
      texte="Personnalise ton objectif et conserve tes préférences dans le navigateur. Elles seront utilisées dans les recherches et messages."
     />

     <div className="panel">
      <div className="formgrid">
       {[
        ['prenom','Prénom (facultatif)'],
        ['lieu','Ville / département'],
        ['heures','Heures par semaine'],
        ['trajet','Temps de trajet maximum'],
        ['poste','Poste souhaité'],
        ['contrat','Type de contrat']
       ].map(([k,l])=>
        <div className="formgroup" key={k}>
         <label>{l}</label>
         <input className="field"
          value={profil[k]}
          onChange={e=>setProfil(p=>({
           ...p,[k]:e.target.value
          }))}/>
        </div>
       )}
      </div>

      <div className="notice">
       Profil enregistré automatiquement dans cet appareil.
       Attention : vider les données du navigateur peut effacer
       ton suivi et tes favoris.
      </div>
     </div>
    </>}

    {/* PIED DE PAGE */}
    <footer className="footer">
     Nour Carrière · Annuaire indépendant d'orientation
     professionnelle · Aucun partenariat ni politique
     d'acceptation du voile n'est présumé pour les entreprises
     citées. Les liens et offres peuvent évoluer.
    </footer>

   </main>
  </div>

  {note&&
   <div className="toast" role="status">
    {note}
   </div>
  }
 </div>;
}

// LANCEMENT DE L'APPLICATION
ReactDOM.createRoot(
 document.getElementById('root')
).render(<App/>);

</script>
</body>
</html>
